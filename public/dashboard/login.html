<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Chatbot Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="subtitle">Pick up conversations and manage your chatbot.</p>

      <div class="form-error" id="error"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Log in</button>
      </form>

      <p class="auth-footer">No account yet? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script>
    var form = document.getElementById("login-form");
    var errorEl = document.getElementById("error");
    var submitBtn = document.getElementById("submit-btn");

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("visible");
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorEl.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      try {
        var res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");
        window.location.href = "index.html";
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
