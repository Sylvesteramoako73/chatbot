<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox — Chatbot Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span id="business-name">Inbox</span>
    </div>
    <nav>
      <a href="index.html" class="active">Inbox</a>
      <a href="settings.html">Settings</a>
      <button class="icon-btn" id="logout-btn">Log out</button>
    </nav>
  </header>

  <div class="app-body">
    <aside class="inbox-list">
      <div class="inbox-tabs">
        <button data-filter="unclaimed" class="active">Unclaimed</button>
        <button data-filter="mine">Mine</button>
        <button data-filter="all">All</button>
      </div>
      <div class="conversation-items" id="conversation-items">
        <div class="empty-state">Loading…</div>
      </div>
    </aside>

    <main class="thread-panel" id="thread-panel">
      <div class="thread-empty">Select a conversation to view it here.</div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var state = { me: null, filter: "unclaimed", conversations: [], selectedId: null, selectedConversation: null };

    var WIDGET_ICON = '<svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
    var WHATSAPP_ICON = '<svg class="icon" viewBox="0 0 24 24"><path d="M3 21l1.65-4.95A9 9 0 1 1 8.2 19.5z"/><path d="M9 10c0 2.5 2.5 5 5 5"/></svg>';

    function toast(message) {
      var el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("visible");
      setTimeout(function () { el.classList.remove("visible"); }, 2500);
    }

    function timeAgo(iso) {
      var diffMs = Date.now() - new Date(iso).getTime();
      var mins = Math.round(diffMs / 60000);
      if (mins < 1) return "now";
      if (mins < 60) return mins + "m";
      var hours = Math.round(mins / 60);
      if (hours < 24) return hours + "h";
      return Math.round(hours / 24) + "d";
    }

    async function api(path, options) {
      var res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
      if (res.status === 401) {
        window.location.href = "login.html";
        throw new Error("Not authenticated");
      }
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    async function loadMe() {
      var data = await api("/api/auth/me");
      state.me = data;
      document.getElementById("business-name").textContent = data.business ? data.business.name : "Inbox";
    }

    async function loadConversations() {
      var data = await api("/api/dashboard/conversations?filter=" + state.filter);
      state.conversations = data.conversations;
      renderConversationList();
    }

    function renderConversationList() {
      var container = document.getElementById("conversation-items");
      if (!state.conversations.length) {
        container.innerHTML = '<div class="empty-state">Nothing here right now.</div>';
        return;
      }
      container.innerHTML = "";
      state.conversations.forEach(function (c) {
        var item = document.createElement("button");
        item.className = "conversation-item" + (c.id === state.selectedId ? " selected" : "");
        item.innerHTML =
          '<span class="channel-icon">' + (c.channel === "whatsapp" ? WHATSAPP_ICON : WIDGET_ICON) + "</span>" +
          '<span class="meta">' +
          '<span class="top-row"><span>' + (c.channel === "whatsapp" ? c.externalId : "Website visitor") + "</span>" +
          "<time>" + timeAgo(c.updatedAt) + "</time></span>" +
          '<span class="preview">' + (c.lastMessage ? escapeHtml(c.lastMessage) : "No messages yet") + "</span>" +
          (c.claimedByName ? '<span class="badge">' + escapeHtml(c.claimedByName) + "</span>" : "") +
          "</span>";
        item.addEventListener("click", function () { selectConversation(c.id); });
        container.appendChild(item);
      });
    }

    function escapeHtml(str) {
      var div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function selectConversation(id) {
      state.selectedId = id;
      renderConversationList();
      var data = await api("/api/dashboard/conversations/" + id + "/messages");
      state.selectedConversation = data.conversation;
      renderThread(data.conversation, data.messages);
    }

    function renderThread(conversation, messages) {
      var panel = document.getElementById("thread-panel");
      var isMine = conversation.claimedBy === state.me.teamMemberId;
      var isUnclaimed = !conversation.claimedBy;
      var who = conversation.channel === "whatsapp" ? conversation.externalId : "Website visitor";

      var actionsHtml = "";
      if (isUnclaimed) {
        actionsHtml = '<button class="btn btn-primary" id="claim-btn">Pick up</button>';
      } else if (isMine) {
        actionsHtml = '<button class="btn btn-secondary" id="close-btn">Close</button>';
      } else {
        actionsHtml = '<span class="badge">Claimed</span>';
      }

      panel.innerHTML =
        '<div class="thread-header"><span class="who">' + (conversation.channel === "whatsapp" ? WHATSAPP_ICON : WIDGET_ICON) + " " + escapeHtml(who) + '</span><span class="actions">' + actionsHtml + "</span></div>" +
        '<div class="thread-messages" id="thread-messages"></div>' +
        (isMine
          ? '<div class="thread-reply"><textarea id="reply-input" placeholder="Type a reply..."></textarea><button class="btn btn-primary" id="reply-send">Send</button></div>'
          : "");

      var messagesEl = document.getElementById("thread-messages");
      messages.forEach(function (m) { appendBubble(messagesEl, m.role, m.content); });
      messagesEl.scrollTop = messagesEl.scrollHeight;

      var claimBtn = document.getElementById("claim-btn");
      if (claimBtn) claimBtn.addEventListener("click", function () { claimSelected(); });

      var closeBtn = document.getElementById("close-btn");
      if (closeBtn) closeBtn.addEventListener("click", function () { closeSelected(); });

      var sendBtn = document.getElementById("reply-send");
      if (sendBtn) sendBtn.addEventListener("click", function () { sendReply(); });
    }

    function appendBubble(container, role, content) {
      var bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      var label = role === "customer" ? "Customer" : role === "bot" ? "Bot" : "Agent";
      bubble.innerHTML = '<span class="role-label">' + label + "</span>" + escapeHtml(content);
      container.appendChild(bubble);
    }

    async function claimSelected() {
      try {
        await api("/api/dashboard/conversations/" + state.selectedId + "/claim", { method: "POST" });
        await loadConversations();
        await selectConversation(state.selectedId);
      } catch (err) {
        toast(err.message);
      }
    }

    async function closeSelected() {
      try {
        await api("/api/dashboard/conversations/" + state.selectedId + "/close", { method: "POST" });
        await loadConversations();
        document.getElementById("thread-panel").innerHTML = '<div class="thread-empty">Select a conversation to view it here.</div>';
        state.selectedId = null;
      } catch (err) {
        toast(err.message);
      }
    }

    async function sendReply() {
      var input = document.getElementById("reply-input");
      var text = input.value.trim();
      if (!text) return;
      input.value = "";
      var messagesEl = document.getElementById("thread-messages");
      appendBubble(messagesEl, "agent", text);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      try {
        await api("/api/dashboard/conversations/" + state.selectedId + "/reply", {
          method: "POST",
          body: JSON.stringify({ text: text }),
        });
      } catch (err) {
        toast(err.message);
      }
    }

    document.querySelectorAll(".inbox-tabs button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".inbox-tabs button").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        state.filter = btn.getAttribute("data-filter");
        loadConversations();
      });
    });

    document.getElementById("logout-btn").addEventListener("click", async function () {
      await fetch("/api/auth/logout", { method: "POST" });
      window.location.href = "login.html";
    });

    function connectStream() {
      var stream = new EventSource("/api/dashboard/stream");
      stream.onmessage = function (event) {
        var data = JSON.parse(event.data);
        loadConversations();
        if (data.conversationId === state.selectedId) {
          selectConversation(state.selectedId);
        }
      };
    }

    (async function init() {
      try {
        await loadMe();
        await loadConversations();
        connectStream();
      } catch (err) {
        // loadMe already redirects to login.html on 401
      }
    })();
  </script>
</body>
</html>
